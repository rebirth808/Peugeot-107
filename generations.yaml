    description: "The Peugeot 107 was a city car produced as part of the B-Zero joint venture between PSA Peugeot Citroën and Toyota, sharing its platform and most components with the mechanically near-identical Citroën C1 and Toyota Aygo. All three models were built together at the TPCA (Toyota Peugeot Citroën Automobile) plant in Kolín, Czech Republic. Unveiled at the 2005 Geneva Motor Show and launched in June 2005, the 107 was offered in three- and five-door hatchback body styles, targeting young, urban, first-time buyers with low purchase, running, and insurance costs. The primary engine was a 1.0-litre (998 cc) 1KR-FE three-cylinder petrol unit developed by Toyota, producing around 68 horsepower, paired with either a five-speed manual or a five-speed automated manual (2-Tronic) transmission. A 1.4-litre HDi diesel sourced from PSA was available in early years before being dropped due to low demand. The 107 emphasised efficiency, with low CO2 emissions that qualified it for reduced or zero road tax in several markets, and strong fuel economy. The car received a facelift in 2009 (Phase 2) with revised front styling, a larger grille, updated bumpers, and minor interior changes, followed by a further mild update in 2012 (Phase 3) introducing LED daytime running lights and additional trim and colour options. Despite its minimalist equipment levels and compact dimensions, the 107 was praised for its nimble city handling, easy parking, and low ownership costs. Production ended in 2014 when it was replaced by the Peugeot 108, which continued the Toyota partnership alongside the second-generation Aygo."
